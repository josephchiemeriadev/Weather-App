<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Page Not Found</title>
    <script>
      const base = "/Weather-App/";

      const redirect = window.location.pathname.replace(base, "");

      window.location.replace(
        base +
          "?/" +
          redirect +
          window.location.search.replace("?", "&") +
          window.location.hash,
      );
    </script>
  </head>
  <body></body>
</html>
